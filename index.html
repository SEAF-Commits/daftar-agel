<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الآجل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#1c2a52;--mute:#6b7592;--line:#c9d6ea;--owe:#b8322a;--ok:#1d7a4b;--btn:#1c2a52;--btnt:#fff;--sheet:#fbfcf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#182040;--ink:#e4e9fb;--mute:#97a2c6;--line:#2a3560;--owe:#ff7b70;--ok:#58d79a;--btn:#8fa6ff;--btnt:#10162a;--sheet:#141b36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10162a;--card:#182040;--ink:#e4e9fb;--mute:#97a2c6;--line:#2a3560;--owe:#ff7b70;--ok:#58d79a;--btn:#8fa6ff;--btnt:#10162a;--sheet:#141b36;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;font-size:17px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 8px}
.total{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.total small{color:var(--mute);font-size:14px;display:block}
.total b{font-size:44px;font-weight:800;line-height:1.1;color:var(--owe)}
.total b span{font-size:18px;font-weight:600;margin-inline-start:6px}
.ico{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin:4px 0 8px}
.facts b{color:var(--ink);font-weight:600}
input,textarea{font:inherit;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--btn);outline-offset:1px}
.list{margin-top:6px;border-inline-start:2px solid var(--owe);background:repeating-linear-gradient(transparent 0 63px,var(--line) 63px 64px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:64px;padding:0 14px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row:active{background:rgba(120,140,200,.12)}
.row .n{font-weight:600;line-height:1.3}
.row .s{font-size:13px;color:var(--mute);line-height:1.3}
.row .a{font-weight:800;font-size:20px;white-space:nowrap}
.late{color:var(--owe)}
.zero{color:var(--ok)}
.empty{padding:30px 14px;color:var(--mute);text-align:center}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnt);border:0;border-radius:30px;padding:12px 22px;font:inherit;font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.shade{position:fixed;inset:0;background:rgba(10,15,40,.5);z-index:20;display:none}
.shade.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--sheet);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:21}
.sheet h2{margin:0 0 2px;font-size:22px}
.bal{font-size:34px;font-weight:800;margin:0 0 8px}
.g{display:grid;gap:8px;margin:8px 0}
.g2{grid-template-columns:1fr 1fr}
.b{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:var(--btn);color:var(--btnt);text-align:center;text-decoration:none;display:block}
.b.debt{background:var(--owe);color:#fff}
.b.pay{background:var(--ok);color:#fff}
.b.soft{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.h{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.h i{font-style:normal;color:var(--mute);font-size:13px;display:block}
.h .x{color:var(--mute);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.lab{font-size:14px;color:var(--mute);margin:8px 0 2px;display:block}
.msg{font-size:12px;color:var(--mute)}
.toast{position:fixed;inset-inline:0;bottom:80px;text-align:center;z-index:30;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="total"><div><small>اللي ليك عند الناس</small><b id="tot">0<span>ج</span></b></div>
 <div style="display:flex;gap:6px"><button class="ico" id="lockBtn"></button><button class="ico" id="setBtn">نسخة احتياطية</button></div></div>
 <div class="facts" id="facts"></div>
 <input id="q" type="search" placeholder="دوّر بالاسم أو العمارة" autocomplete="off">
</header>
<div class="list" id="list"></div>
</div>
<button class="fab" id="add">+ عميل جديد</button>
<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
var S={c:[],pin:'',locked:false};
try{var r=localStorage.getItem('daftar-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('daftar-v1',JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على الجهاز')}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function fmt(n){return Number(n).toLocaleString('en-US')}
function bal(c){return c.e.reduce(function(s,x){return s+(x.k==='d'?x.a:-x.a)},0)}
function since(c){var p=c.e.filter(function(x){return x.k==='p'}).map(function(x){return x.t});var t=p.length?Math.max.apply(null,p):(c.e[0]?c.e[0].t:Date.now());return Math.floor((Date.now()-t)/864e5)}
function dstr(t){try{return new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}catch(e){return ''}}
function toast(m){var t=$('toast');t.innerHTML='<span>'+esc(m)+'</span>';setTimeout(function(){t.innerHTML=''},1800)}
function find(id){return S.c.filter(function(c){return c.id===id})[0]}

function render(){
 var q=$('q').value.trim(),tot=0,top=null,old=null;
 S.c.forEach(function(c){var b=bal(c);if(b>0){tot+=b;if(!top||b>bal(top))top=c;if(!old||since(c)>since(old))old=c}});
 $('tot').innerHTML=fmt(tot)+'<span>ج</span>';
 $('facts').innerHTML=top?'<span>الأكتر: <b>'+esc(top.n)+'</b> '+fmt(bal(top))+' ج</span><span>الأقدم: <b>'+esc(old.n)+'</b> '+since(old)+' يوم</span>':'<span>مفيش ديون دلوقتي</span>';
 $('lockBtn').textContent=S.locked?'🔒 مقفول':'🔓 مفتوح';
 $('setBtn').style.display=S.locked?'none':'';
 var l=S.c.filter(function(c){return !q||(c.n+' '+(c.note||'')).indexOf(q)>-1}).sort(function(a,b){return bal(b)-bal(a)});
 $('list').innerHTML=l.length?l.map(function(c){var b=bal(c),d=since(c);
  return '<button class="row" data-id="'+c.id+'"><div><div class="n">'+esc(c.n)+'</div><div class="s">'+esc(c.note||'')+(b>0&&d>30?' <span class="late">· متأخر '+d+' يوم</span>':'')+'</div></div><div class="a '+(b>0?'':'zero')+'">'+(b>0?fmt(b)+' ج':b<0?'له '+fmt(-b):'خالص ✓')+'</div></button>'}).join(''):'<div class="empty">'+(S.c.length?'مفيش حد بالاسم ده.':'ابدأ بأول عميل: اضغط «+ عميل جديد».')+'</div>';
}
function open(h){$('sheet').innerHTML=h;$('shade').classList.add('on')}
function close(){$('shade').classList.remove('on');render()}
$('shade').addEventListener('click',function(e){if(e.target===this)close()});
$('q').addEventListener('input',render);
$('list').addEventListener('click',function(e){var b=e.target.closest('.row');if(b)detail(b.dataset.id)});

function custForm(c){
 open('<h2>'+(c?'تعديل العميل':'عميل جديد')+'</h2><label class="lab">الاسم</label><input id="fn" value="'+esc(c?c.n:'')+'" placeholder="أم أحمد"><label class="lab">ملاحظة (اختياري)</label><input id="fo" value="'+esc(c?c.note:'')+'" placeholder="التالت، عمارة ٥"><label class="lab">رقم واتساب (اختياري)</label><input id="fp" inputmode="tel" value="'+esc(c?c.ph:'')+'" placeholder="01xxxxxxxxx"><div class="g g2"><button class="b" id="ok">حفظ</button><button class="b soft" id="no">إلغاء</button></div>');
 $('fn').focus();$('no').onclick=function(){c?detail(c.id):close()};
 $('ok').onclick=function(){var n=$('fn').value.trim();if(!n){toast('اكتب الاسم');return}
  if(c){c.n=n;c.note=$('fo').value.trim();c.ph=$('fp').value.trim();save();detail(c.id)}
  else{var x={id:'c'+Date.now(),n:n,note:$('fo').value.trim(),ph:$('fp').value.trim(),e:[]};S.c.push(x);save();detail(x.id)}}
}
$('add').onclick=function(){custForm()};

function phone(p){var d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.indexOf('00')===0)d=d.slice(2);else if(d[0]==='0')d='20'+d.slice(1);else if(d[0]==='1'&&d.length===10)d='20'+d;return d}
function remind(b,name){var nm=name.indexOf('أم ')===0||name.indexOf('ام ')===0?name:name;
 return 'السلام عليكم يا '+nm+'، أتمنى تكون/ي بخير 🌷\nحبيت أفكّرك بخفة إن حسابك عندنا '+fmt(b)+' جنيه، وقت ما تيسّر معاك وبدون أي استعجال.\nربنا يبارك لك، وشكراً على ذوقك وتعاملك الجميل.'}

function detail(id){
 var c=find(id);if(!c){close();return}
 var b=bal(c),h=c.e.slice().reverse().slice(0,30).map(function(x){
  return '<div class="h"><div>'+esc(x.m||(x.k==='d'?'دين':'دفعة'))+'<i>'+dstr(x.t)+'</i></div><div style="text-align:end"><b class="'+(x.k==='d'?'late':'zero')+'">'+(x.k==='d'?'+':'−')+fmt(x.a)+'</b>'+(S.locked?'':'<br><button class="x" data-x="'+x.t+'">مسح</button>')+'</div></div>'}).join('');
 open('<h2>'+esc(c.n)+'</h2><div class="msg">'+esc(c.note||'')+'</div><div class="bal '+(b>0?'late':'zero')+'">'+(b>0?fmt(b)+' ج عليه':b<0?'ليه '+fmt(-b)+' ج':'حسابه خالص')+'</div>'
 +'<input id="am" inputmode="decimal" placeholder="المبلغ" style="font-size:22px"><input id="nt" placeholder="عيش وجبنة (اختياري)" style="margin-top:8px">'
 +'<div class="g g2"><button class="b debt" id="d">سجّل دين</button><button class="b pay" id="p">سجّل دفعة</button></div>'
 +(b>0?'<button class="b soft" id="rm">تذكير بالواتساب</button>':'')
 +'<div id="rbox"></div><div style="margin-top:10px">'+(h||'<div class="empty">لسه مفيش حركات.</div>')+'</div>'
 +'<div class="g g2" style="margin-top:12px"><button class="b soft" id="cl">رجوع</button>'+(S.locked?'':'<button class="b soft" id="ed">تعديل / مسح العميل</button>')+'</div>');
 $('am').focus();
 function addE(k){var a=parseFloat($('am').value.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}));if(!(a>0)){toast('اكتب المبلغ');return}
  c.e.push({t:Date.now(),k:k,a:Math.round(a*100)/100,m:$('nt').value.trim()});save();toast(k==='d'?'اتسجّل الدين':'اتسجّلت الدفعة');detail(id)}
 $('d').onclick=function(){addE('d')};$('p').onclick=function(){addE('p')};
 $('cl').onclick=close;
 if($('ed'))$('ed').onclick=function(){custForm(c)};
 if($('rm'))$('rm').onclick=function(){var ph=phone(c.ph);
  $('rbox').innerHTML='<label class="lab">الرسالة (تقدر تعدّلها)</label><textarea id="tx" rows="5">'+esc(remind(b,c.n))+'</textarea><a class="b" id="wa" target="_blank" rel="noopener" style="margin-top:8px">فتح واتساب</a><div class="msg">'+(ph?'':'مفيش رقم محفوظ: واتساب هيطلب منك تختار الشخص. ')+'هتدوس إرسال بنفسك.</div>';
  var up=function(){$('wa').href='https://wa.me/'+ph+'?text='+encodeURIComponent($('tx').value)};up();$('tx').oninput=up};
 $('sheet').querySelectorAll('.x').forEach(function(x){x.onclick=function(){if(x.dataset.sure){c.e=c.e.filter(function(e){return String(e.t)!==x.dataset.x});save();detail(id)}else{x.dataset.sure=1;x.textContent='اضغط تاني للتأكيد'}}});
}

function pinSheet(mode){
 open('<h2>'+(mode==='set'?'اختار رقم سري للقفل':'اكتب الرقم السري')+'</h2><div class="msg">'+(mode==='set'?'لما الدفتر يتقفل، العامل يقدر يسجّل بس مايقدرش يمسح أو يعدّل.':'')+'</div><input id="pn" type="password" inputmode="numeric" maxlength="8" style="font-size:24px;margin-top:8px"><div class="g g2"><button class="b" id="ok">تمام</button><button class="b soft" id="no">إلغاء</button></div>');
 $('pn').focus();$('no').onclick=close;
 $('ok').onclick=function(){var v=$('pn').value.trim();
  if(mode==='set'){if(v.length<3){toast('3 أرقام على الأقل');return}S.pin=v;S.locked=true;save();toast('الدفتر اتقفل');close()}
  else{if(v===S.pin){S.locked=false;save();toast('الدفتر اتفتح');close()}else toast('الرقم غلط')}}
}
$('lockBtn').onclick=function(){if(S.locked)pinSheet('unlock');else if(!S.pin)pinSheet('set');else{S.locked=true;save();render();toast('الدفتر اتقفل')}};

$('setBtn').onclick=function(){
 open('<h2>نسخة احتياطية</h2><div class="msg">الدفتر محفوظ على موبايلك. انسخ النص ده وابعته لنفسك على واتساب من وقت للتاني، عشان لو الموبايل ضاع.</div><textarea id="bk" rows="6" readonly>'+esc(JSON.stringify({c:S.c}))+'</textarea><div class="g g2"><button class="b" id="cp">نسخ</button><button class="b soft" id="im">استرجاع من نص</button></div>'
 +(S.pin?'<button class="b soft" id="np">تغيير الرقم السري</button>':'')+'<button class="b soft" id="cl">رجوع</button>');
 $('cl').onclick=close;
 $('cp').onclick=function(){var t=$('bk');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('اتنسخ')},function(){document.execCommand('copy');toast('اتنسخ')})}catch(e){try{document.execCommand('copy');toast('اتنسخ')}catch(e2){}}};
 if($('np'))$('np').onclick=function(){pinSheet('set')};
 $('im').onclick=function(){var t=$('bk');if(!t.dataset.imp){t.value='';t.readOnly=false;t.placeholder='الصق النسخة هنا ثم اضغط استرجاع تاني';t.dataset.imp=1;t.focus();return}
  try{var d=JSON.parse(t.value);if(!Array.isArray(d.c))throw 0;S.c=d.c;save();toast('اتسترجع الدفتر');close()}catch(e){toast('النص مش صحيح')}};
};
render();
</script>
</body>
</html>
